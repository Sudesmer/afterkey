[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="afterkey"
version="1.1.0"
description="Small-footprint defensive research tool for post-revocation secret persistence."
readme="README.md"
requires-python=">=3.11"
dependencies=[]

[project.scripts]
afterkey="afterkey.cli:main"

[tool.setuptools.packages.find]
include=["afterkey*"]
